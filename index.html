<!DOCTYPE html>
<html lang="en">
    <head>
        <title>AWS Cloud Demo</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>☁️ Exploring AWS S3</h1>
        <p>Static websites hosted on Amazon S3 — simple, scalable, and serverless.</p>

        <img src="coffee.jpg" width="500" alt="A warm cup of coffee" />

        <!-- CORS demo: fetches content from a different S3 bucket origin -->
        <div id="tofetch"></div>
        <script>
            var tofetch = document.getElementById("tofetch");

            fetch('extra-page.html')
            .then((response) => {
                return response.text();
            })
            .then((html) => {
                tofetch.innerHTML = html;
            });
        </script>
    </body>
</html>
