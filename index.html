<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS S3 — Static Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-wrapper">

        <!-- Hero Section -->
        <div class="hero">
            <span class="tag">AWS S3 · Static Web Hosting</span>
            <h1>Hello from<br>Amazon S3 ☁️</h1>
            <p class="lead">
                This page is hosted entirely on <strong>AWS S3</strong> as a static website — no servers, no backend.
                Below, it dynamically loads content from another origin using a <code>fetch()</code> request.
            </p>
        </div>

        <!-- Image -->
        <img class="hero-image" src="coffee.jpg" alt="Coffee" />

        <hr class="divider">

        <!-- Loaded Content Area -->
        <p class="section-label">Content loaded via fetch()</p>
        <div id="tofetch"></div>

    </div>

    <script>
        var tofetch = document.getElementById("tofetch");

        fetch('extra-page.html')
        .then((response) => {
            return response.text();
        })
        .then((html) => {
            tofetch.innerHTML = html;
        });
    </script>
</body>
</html>
